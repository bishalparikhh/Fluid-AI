name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/fluid-ai:latest ./app

    - name: Push Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/fluid-ai:latest

    - name: Configure Kubectl
      run: |
        mkdir ~/.kube
        echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

    - name: Deploy
      run: |
        kubectl apply -f k8s/
        kubectl rollout restart deployment/api -n infra-demo