apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fluid-ai-postgres
  namespace: fluid-ai

spec:
  serviceName: fluid-ai-postgres-service

  replicas: 1

  selector:
    matchLabels:
      app: fluid-ai-postgres

  template:
    metadata:
      labels:
        app: fluid-ai-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: fluid_ai

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fluid-ai-db
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fluid-ai-db
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fluid-ai-postgres-service
  namespace: fluid-ai

spec:
  clusterIP: None

  selector:
    app: fluid-ai-postgres

  ports:
    - port: 5432
      targetPort: 5432